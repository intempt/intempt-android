VERSION=6.0.0


SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true

# Releasing to Maven Central (INT-5897).
#
# `publishToMavenCentral` only uploads a Central Portal staging deployment. The build reports
# BUILD SUCCESSFUL and nothing reaches Maven Central until someone clicks Publish on the portal.
# That happened to v2.0.1 (2026-06-24) and again to v5.1.0 (2026-11). A publish that reports
# success and ships nothing is the worst outcome, because nobody goes looking.
#
# So CI calls `publishAndReleaseToMavenCentral` explicitly (publish.yml). Release is deliberately
# NOT switched on here, so a local `./gradlew publishToMavenCentral` still only stages and cannot
# make an irreversible release by accident. The key that used to be here,
# `mavenCentralAutomaticPublishing=true`, was never read by com.vanniktech.maven.publish 0.28.0
# (that version only knows SONATYPE_AUTOMATIC_RELEASE), which is why v5.1.0 stayed staged.

POM_NAME=intempt-android
POM_PACKAGING=aar

POM_DESCRIPTION=Intempt android SDK.
POM_INCEPTION_YEAR=2024

POM_URL=https://github.com/intempt/intempt-android
POM_SCM_URL=https://github.com/intempt/intempt-android
POM_SCM_CONNECTION=scm:git:git://github.com/intempt/intempt-android.git
