name: CI

# Until now nothing ran on a pull request — publish.yml triggers only on a v* tag,
# so a change that did not compile could be merged and published. This workflow is
# the gate. It is also the only place this SDK can be compiled at all: it requires
# the Android SDK, which is not present on every contributor's machine.
on:
  push:
    branches: [main]
  pull_request:

# Prod ingestion credentials and e2e fixtures, from repository secrets. The build reads these
# exact names (see sample/build.gradle.kts and app/build.gradle.kts), falling back to
# placeholders when they are absent — so a fork without secrets still builds and the tests
# that need them skip rather than fail.
#
# The repository is public. The key is never committed: locally it comes from a gitignored
# local.properties, and here from secrets, and the generated config asset is produced at build
# time in both cases.
env:
  # Optional. Raises the OWASP Dependency-Check scan's NVD feed rate limit from ~5 to ~50
  # requests/30s. Absent (e.g. on a fork without repo secrets), the scan still runs -- just
  # slower -- rather than failing; see the dependencyCheck block in app/build.gradle.kts.
  INTEMPT_NVD_API_KEY: ${{ secrets.INTEMPT_NVD_API_KEY }}
  INTEMPT_API_KEY: ${{ secrets.INTEMPT_API_KEY }}
  INTEMPT_ORGANIZATION_ID: ${{ secrets.INTEMPT_ORGANIZATION_ID }}
  INTEMPT_PROJECT_ID: ${{ secrets.INTEMPT_PROJECT_ID }}
  INTEMPT_SOURCE_ID: ${{ secrets.INTEMPT_SOURCE_ID }}
  INTEMPT_E2E_USER_ID: ${{ secrets.INTEMPT_E2E_USER_ID }}
  INTEMPT_E2E_PRODUCT_ID: ${{ secrets.INTEMPT_E2E_PRODUCT_ID }}
  INTEMPT_E2E_FEED_ID: ${{ secrets.INTEMPT_E2E_FEED_ID }}
  INTEMPT_E2E_FEED_FIELDS: ${{ secrets.INTEMPT_E2E_FEED_FIELDS }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and on its own, because a leaked credential is the one failure that cannot be
  # fixed by a follow-up commit: once it is in a public repo's history it has to be rotated.
  #
  # This exists because GitHub's own secret scanning is OFF on every public repo in the org —
  # an enforced org-level security configuration named "Legacy" pins it disabled, and a
  # repo-level enable is refused with HTTP 422. Until that configuration is changed by an org
  # owner, this job is the only scanning these repos have.
  #
  # It is not a replacement for the platform feature. It sees this repo only, and only what is
  # in the diff or the tree at scan time; GitHub's would scan history, validate whether a found
  # key is live, and block the push before it ever lands.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history: a secret removed in a later commit is still in the pack, and still
          # has to be rotated. Scanning only the tip would report clean on exactly that case.
          fetch-depth: 0

      - name: Scan for credentials
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5  # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      # Two patterns gitleaks does not know, both of which have actually leaked in this org.
      #
      # An Intempt ingestion key is "<id>.<secret>" with no vendor prefix, so no provider rule
      # matches it — one is sitting in intempt-android-release-verification's history today.
      # The Authorization header is the base64 of that key and reads as ordinary base64.
      #
      # Scoped to tracked files and excluding this workflow, so the patterns below do not match
      # themselves. Tests carry deliberately fake keys, which is why the match requires a
      # realistic secret half rather than any dot-separated token.
      - name: Scan for Intempt-shaped credentials
        run: |
          set -uo pipefail
          hits=$(git grep -nIE \
            "(Basic [A-Za-z0-9+/]{40,}={0,2}|[0-9a-f]{16,}\.[A-Za-z0-9_-]{24,})" \
            -- ':!.github/workflows/ci.yml' ':!*Test*' ':!*test*' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible Intempt credential in the tree:"
            echo "$hits"
            exit 1
          fi
          echo "No Intempt-shaped credentials found."

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      # Java first and on its own: the vendored delivery substrate in
      # com.intempt.core.queue is Java, and isolating it gives an unambiguous
      # signal about the vendoring rather than a mixed Java/Kotlin failure.
      - name: Compile Java (vendored substrate)
        run: ./gradlew :app:compileDebugJavaWithJavac --stacktrace

      - name: Compile Kotlin + assemble
        run: ./gradlew :app:assembleDebug --stacktrace

      # The sample app consumes the library the way a customer does, so it catches what
      # building the library alone cannot: manifest merger conflicts, a minSdk regression,
      # and missing transitive dependencies.
      - name: Assemble sample app (debug)
        run: ./gradlew :sample:assembleDebug --stacktrace

      # The release variant is the one that matters. It runs R8 over the consumer's code
      # using only the rules the AAR ships, which is the only way to prove those rules are
      # correct and complete. This caught a hard build failure for every consumer with
      # minification enabled: ktor pulls in slf4j-api, whose LoggerFactory references
      # org.slf4j.impl classes that do not exist on Android, and R8 fails on the missing
      # class rather than warning. The library now ships -dontwarn for it.
      - name: Assemble sample app (release, R8)
        run: ./gradlew :sample:assembleRelease --stacktrace

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Boots the SDK inside a host application at API 24 and 34 and calls every public
      # entry point. All three API-level crashes fixed on this branch are reachable from
      # initialize() plus one tracking call, and none were caught by the library's own
      # unit tests, because those never start the SDK.
      - name: Run sample app tests (SDK in a host app, JVM at API 24 + 34)
        run: ./gradlew :sample:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  method-count:
    name: SDK method count regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      # This counts the SDK's OWN method count, not the sample app's post-R8 total. The
      # AAR's classes.jar holds only code compiled from :app — Ktor/Jackson/Glide/Firebase/
      # Compose ship as transitive Maven dependencies and are never merged into it, so they
      # cannot inflate this number. (The 28,668-method, 3.64MB figure for a sample app that
      # only calls initialize() is almost entirely those dependencies after R8 merges
      # everything into one dex; that is a separate, larger trim effort, not this gate.)
      #
      # d8-dexing classes.jar in isolation prints warnings about missing Android/Kotlin
      # stdlib types ("was not found, it is required for ... desugaring") because no
      # classpath is supplied — those are expected and harmless; d8 still emits a correct
      # dex and method_ids_size still counts every method the SDK itself defines or
      # references from its own code.
      #
      # Ceiling: measured baseline is 2,409 methods (:app's own compiled code, verified
      # locally at 2,413 via this exact d8/dexdump pipeline — the few-method difference is
      # from build/toolchain drift, not scope). 2,700 gives ~12% headroom for normal
      # feature growth while still catching an accidental heavy dependency pull or a
      # generated-code explosion (e.g. kapt/Dagger blowing up, or accidentally vendoring a
      # third-party lib's sources into :app).
      - name: Build release AAR
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Count SDK's own methods (d8 + dexdump on the AAR's classes.jar)
        run: |
          set -euo pipefail
          AAR=$(find app/build/outputs/aar -name "*.aar" | head -1)
          if [ -z "$AAR" ]; then
            echo "::error::No release AAR found under app/build/outputs/aar"
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          unzip -q "$AAR" classes.jar -d "$WORKDIR"

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS_DIR/d8" --release --output "$WORKDIR" "$WORKDIR/classes.jar"

          METHOD_COUNT=$("$BUILD_TOOLS_DIR/dexdump" -f "$WORKDIR/classes.dex" \
            | grep "method_ids_size" | awk '{print $NF}')

          # Raised from 2700 for the 3.0 API. Measured at 2898 with the same d8 + dexdump
          # commands above; the ceiling is that number plus ~50 of headroom, deliberately tight so
          # the gate keeps biting.
          #
          # The growth is the contract surface, not slack. IntemptInstance is a full delegating
          # class (named instances are contractual — a singleton is not conformant), and every
          # defaulted method carries an @JvmOverloads set on both it and Intempt so Java callers
          # can use them. IntemptError is 12 cases, IntemptValue 6, plus the options and
          # credential types.
          #
          # The gate already earned its keep on this change: it caught 74 generated members from
          # declaring IntemptError's cases as `data` classes. Nobody copies an error with a
          # different status or destructures one, so they are plain classes and that is 55 methods
          # back. Check for that kind of waste before raising this again.
          CEILING=2950
          echo "SDK's own method count: $METHOD_COUNT (ceiling: $CEILING, baseline: ~2,409)"
          if [ "$METHOD_COUNT" -gt "$CEILING" ]; then
            echo "::error::SDK method count $METHOD_COUNT exceeds ceiling $CEILING. If this growth is intentional, raise CEILING in .github/workflows/ci.yml with a note on why."
            exit 1
          fi

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      # The NVD feed is large and rate-limited; caching it means every PR after the first does an
      # incremental update instead of a full re-download, and a rate-limited run degrades to
      # "slow" rather than "fails the job outright" on cache hit.
      - name: Cache OWASP Dependency-Check NVD data
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-nvd-${{ github.run_id }}
          restore-keys: |
            dependency-check-nvd-

      - name: Lint
        run: ./gradlew :app:lintDebug :sample:lintDebug --stacktrace

      # API-compatibility gate against the android-api-level-23 signature, adopted from
      # mixpanel-android. Lint's NewApi only reads our sources, so a dependency reaching for a
      # class that does not exist at minSdk is invisible to it — that is how Jackson's
      # BootstrapMethodError (API 26) shipped and killed every host app on Android 7.
      # AnimalSniffer checks the compiled artifact, so it sees into dependencies.
      - name: AnimalSniffer (API compatibility at minSdk)
        run: ./gradlew :app:animalsnifferRelease --stacktrace

      # ABI-compatibility gate: fails if the public surface (app/api/app.api) drifted without
      # the file being regenerated via `./gradlew :app:apiDump` and committed. AnimalSniffer
      # above checks calls made *by* the SDK against the platform; this checks the surface the
      # SDK exposes *to* consumers, so an accidental breaking change to a public signature is
      # caught here instead of shipping silently.
      - name: Binary compatibility (public API surface)
        run: ./gradlew :app:apiCheck --stacktrace

      # Pre-existing violations are frozen in app/config/ktlint/baseline.xml (567 at the time of
      # writing, counted with grep -c "<error"), so this
      # gates new Kotlin only. Reformatting the existing codebase would be a 200-file diff
      # with no behavioural change; it can happen incrementally.
      - name: ktlint
        run: ./gradlew :app:ktlintCheck :sample:ktlintCheck --stacktrace

      # Static analysis for complexity, duplication, and code smells — a different concern than
      # ktlint above, which is formatting only. Pre-existing findings (112 at the time of
      # writing) are frozen in app/config/detekt/baseline.xml, so this gates new findings only.
      - name: detekt
        run: ./gradlew :app:detekt --stacktrace

      # OWASP Dependency-Check against :app's resolved dependency graph specifically -- not
      # :mutation, which is a sidecar that recompiles a handful of :app's own pure-JVM sources
      # with no third-party dependency graph of its own to scan. Gated at CVSS >= 9 (critical);
      # see the dependencyCheck block in app/build.gradle.kts for why the threshold is not "any
      # known CVE".
      # Runs only when an NVD API key is configured, and that is not a convenience.
      #
      # dependency-check 13 cannot complete without one. With no key it throws
      # "Invalid API Key, length of 0 too short to provided a masked partial key" while building
      # its own log line, so the scan fails before analysing anything — and NIST now rate-limits
      # keyless access hard enough that it would be unusable regardless.
      #
      # Skipping is stated rather than hidden. `continue-on-error` would render a green check for
      # a scan that never ran, which is worse than no scan: it reads as "no vulnerabilities".
      #
      # To turn this on: request a free key at https://nvd.nist.gov/developers/request-an-api-key
      # and add it as the INTEMPT_NVD_API_KEY repository secret. Nothing else changes.
      - name: Dependency vulnerability scan
        if: env.INTEMPT_NVD_API_KEY != ''
        run: ./gradlew :app:dependencyCheckAnalyze --stacktrace

      - name: Note when the vulnerability scan was skipped
        if: env.INTEMPT_NVD_API_KEY == ''
        run: |
          echo "::warning title=Dependency scan skipped::INTEMPT_NVD_API_KEY is not set, so :app:dependencyCheckAnalyze did not run. This build has NOT been checked for known CVEs. Request a key at https://nvd.nist.gov/developers/request-an-api-key and add it as a repository secret."

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dependency-check-report
          path: app/build/reports/dependency-check/

      # Gated. This was continue-on-error while the measurement was broken — Robolectric's
      # classloader discarded JaCoCo's instrumentation, so the report read near-zero regardless
      # of what the tests exercised. That is fixed, the number is real, and it now blocks.
      #
      # The floor is a ratchet pinned just under the measured value, not the 85% target: a gate
      # set above the current number fails every PR including the ones that improve it. See the
      # note in app/build.gradle.kts for the ramp.
      - name: Coverage report and floor
        run: ./gradlew :app:jacocoCoverageVerification --stacktrace

      # Mutation testing on the SDK's pure-JVM decision logic, gated at 85% mutants killed and
      # 85% line coverage. PIT cannot run against an Android library module, so :mutation applies
      # java-library and compiles the same source files out of :app. See mutation/build.gradle.kts.
      #
      # Coverage says a line ran. This says the tests would notice if it changed — which is the
      # property that matters for the delete-versus-retry branch, where a silent category change
      # either drops events permanently or wedges the queue.
      - name: Mutation testing
        run: ./gradlew :mutation:pitest --stacktrace

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: mutation-report
          path: mutation/build/reports/pitest/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 23 is minSdk, 34 is the current target. Testing the floor is the point: the
        # three API-level crashes found on this branch (DatePicker.setOnDateChangedListener,
        # CompletableFuture, PackageInfo.longVersionCode) were all invisible at a higher
        # minSdk, and a claim to support Android 7 is only as good as a run that proves it.
        api-level: [23, 34]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Both modules. :app proves the queue's durability properties against real
          # SQLite; :sample drives the SDK through its public API inside a real host app
          # and reads the assertions back out of the on-device queue. The second is the
          # one that catches what nothing else can — the API 24 startup crash, a password
          # reaching the queue, identify()/group() dropping the obvious call were all found
          # by hand with adb before this existed, and manual evidence gates nothing.
          script: ./gradlew :app:connectedDebugAndroidTest :sample:connectedDebugAndroidTest --stacktrace

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: instrumented-report-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            sample/build/reports/androidTests/

  # Separate and non-gating on purpose. These call the live ingestion endpoint, so a transient
  # network fault or an outage must not fail a pull request about unrelated code — which is
  # exactly what happened when they ran inside the unit-test job:
  #   SocketException: Unexpected end of file from server
  # The result is still reported; it just does not block a merge.
  prod-e2e:
    name: Prod delivery (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947  # v4

      - name: Delivery against api.intempt.com
        run: ./gradlew :app:testDebugUnitTest --tests "com.intempt.core.queue.ProdDeliveryTest" -Pintempt.prodTests=true --stacktrace

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: prod-e2e-report
          path: app/build/reports/tests/
