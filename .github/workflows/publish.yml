name: Publish to Maven Central

# Triggered ONLY by pushing a tag like v2.0.1, or manually from the Actions tab.
# Normal pushes/PRs to main do NOT publish.
# SAFETY: publishing is refused unless the tagged commit is contained in main,
# so a release can never be cut from a feature branch / stale checkout.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.0.1)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # contents: write is needed for the GitHub Release created below (softprops/action-gh-release);
    # everything else in this job only reads the repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can verify the commit is on main

      - name: Refuse to publish unless the commit is on main
        run: |
          git fetch --quiet origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Commit $GITHUB_SHA is contained in main — proceeding."
          else
            echo "::error::Refusing to publish: $GITHUB_REF ($GITHUB_SHA) is NOT on main. Merge to main and tag the merged commit."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Determine release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # A tag with no changelog entry is how this SDK reached 2.0.1 with no changelog at all. The
      # workflow already resolved RELEASE_VERSION above, so the check costs nothing and runs before
      # anything is uploaded — a staged deployment is awkward to retract, an early exit is not.
      - name: Refuse to publish a version with no CHANGELOG entry
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing. See RELEASING.md step 2."
            exit 1
          fi
          if ! grep -qE "^## \\[${RELEASE_VERSION}\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${RELEASE_VERSION}]' heading. Move the Unreleased section under it before tagging — see RELEASING.md step 2."
            echo "Headings currently present:"
            grep -E "^## " CHANGELOG.md || true
            exit 1
          fi
          echo "CHANGELOG.md documents ${RELEASE_VERSION}."

      # Two artifacts publish from this repo (:app -> intempt-android, :push -> intempt-push),
      # both applying com.vanniktech.maven.publish. Configuring both in the SAME Gradle invocation
      # fails: `Cannot set the value of task ':push:createStagingRepository' property 'buildService'
      # ... using a provider of type SonatypeRepositoryBuildService` — the plugin's Sonatype
      # staging-repository build service can't be registered twice in one build (0.28.0; a plugin
      # bump was tried and didn't clear it — see RELEASING.md). --configure-on-demand alone does
      # NOT fix it when both modules' tasks are requested together; the two publishes must be
      # separate `./gradlew` processes.
      - name: Publish :app to Maven Central (staged deployment)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:publishToMavenCentral -PVERSION="$RELEASE_VERSION" --configure-on-demand --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Publish :push to Maven Central (staged deployment)
        run: |
          ./gradlew :push:publishToMavenCentral -PVERSION="$RELEASE_VERSION" --configure-on-demand --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      # NOTE: both use the STAGED task — after they succeed, go to central.sonatype.com,
      # review the deployment(s), and click "Publish" to release them to Maven Central.
      # To auto-release instead, change the task to: publishAndReleaseToMavenCentral

      # Additive only — does not touch the Maven Central publish above. The CHANGELOG check
      # earlier in this job already proved a matching "## [<version>]" heading exists, so this
      # just extracts the body between that heading and the next "## " heading and attaches it
      # as the GitHub Release notes, instead of a human retyping what's already written.
      - name: Extract this version's CHANGELOG section
        run: |
          set -euo pipefail
          awk -v ver="$RELEASE_VERSION" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "Extracted release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631  # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ env.RELEASE_VERSION }}"
          body_path: release-notes.md
          # workflow_dispatch has no tag to attach a release to; only create one for a real
          # tag push.
          draft: false
        if: github.event_name == 'push'
