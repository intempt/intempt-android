name: Tag a release on merge to main

# Reads VERSION from gradle.properties on every push to main. If v<VERSION> doesn't exist yet
# and CHANGELOG.md documents it, creates and pushes that tag. The tag does not publish by itself:
# a person starts publish.yml from it (see RELEASING.md). A merge to main that doesn't bump VERSION is a no-op here: this
# workflow never re-tags or moves an existing tag, so it can't accidentally re-trigger a release
# or overwrite a deployment someone already dealt with on the Central Portal.
on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: intempt-ubuntu-github-runner
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # need full tag history to check for an existing tag
          # The tag is pushed with the default GITHUB_TOKEN on purpose: GitHub does not start other
          # workflows from a GITHUB_TOKEN push, so this tag does NOT publish. A person releases it by
          # running publish.yml from this tag with confirm "release <version>" (see RELEASING.md).

      - name: Tag the release if VERSION is new
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^VERSION=' gradle.properties | cut -d= -f2)"
          TAG="v${VERSION}"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — VERSION wasn't bumped in this push. Nothing to do."
            exit 0
          fi

          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::notice::CHANGELOG.md has no '## [${VERSION}]' heading yet — not tagging. publish.yml would reject this version anyway; add the entry first."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Pushed ${TAG}. To release it, run publish.yml from ${TAG} with confirm \"release ${VERSION}\"."